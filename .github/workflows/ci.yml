name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python y dependencias
        run: |
          uv python install 3.11
          uv sync --all-packages --frozen

      - name: Verificación completa
        run: ./scripts/verify.sh

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t gasolineras-api .

      - name: Arrancar y comprobar /health
        run: |
          docker run -d --name api -p 8080:8080 gasolineras-api
          for i in $(seq 30); do
            if curl -fsS http://localhost:8080/health > health.json; then break; fi
            sleep 1
          done
          cat health.json; echo
          grep -q '"status":"ok"' health.json
          # Los precios se cargan en segundo plano; se muestran sin hacer fallar el CI si el MITECO no responde.
          sleep 30; curl -fsS http://localhost:8080/health; echo
          docker logs api 2>&1 | tail -20
          docker stop api
