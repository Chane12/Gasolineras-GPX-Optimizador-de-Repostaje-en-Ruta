# Raíz del monorepo: workspace uv (sin paquete propio).
# Cada pieza Python es un miembro con su propio pyproject.toml y un único uv.lock compartido.
# Ver docs/decisions/0003-monorepo-uv-workspace.md

[tool.uv.workspace]
members = ["core", "legacy/streamlit"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "web"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]
ignore = [
    "E501",  # line too long — handled by formatter
    "N802",  # function name should be lowercase (legacy compat)
    "N803",  # argument name should be lowercase (legacy compat)
    "N806",  # variable in function should be lowercase
    "B904",  # raise without from (too noisy on existing code)
]

[tool.ruff.lint.per-file-ignores]
# sys.path shim para Streamlit Cloud antes de importar el motor
"legacy/streamlit/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["gasolineras_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["core/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--import-mode=importlib",
]
markers = [
    "network: tests that require internet access (deselect with '-m not network')",
    "slow: tests that take >10s (deselect with '-m not slow')",
]

[tool.pyright]
include = ["core/src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
