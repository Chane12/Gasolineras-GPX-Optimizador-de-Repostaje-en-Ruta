# API HTTP (FastAPI) sobre el motor gasolineras_core. Ver api/CLAUDE.md y ADR 0001.
[project]
name = "gasolineras-api"
version = "0.1.0"
description = "API HTTP de Gasolineras en Ruta sobre gasolineras_core"
readme = "CLAUDE.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "gasolineras-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.20",
]

[tool.uv.sources]
gasolineras-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gasolineras_api"]
