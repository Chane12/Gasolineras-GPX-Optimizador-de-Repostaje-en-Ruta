<!doctype html>
<html lang="es">
<head>

</head>
<body>
<x-dc>
<helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEFEC; font-family: 'Familjen Grotesk', sans-serif; color: #161B1F">

  <svg width="390" height="320" viewBox="0 0 390 320" style="position: absolute; left: 0; top: 0" role="img" aria-label="Detalle del mapa: la gasolinera Ballenoil a 400 metros de la ruta, en Tarancón">
    <rect width="390" height="320" fill="#EFEFEC"></rect>
    <g fill="none" stroke="#E1E1DC" stroke-width="1.2">
      <path d="M-10 60 C 80 40, 160 90, 250 70 S 350 50, 400 70"></path>
      <path d="M-10 280 C 90 260, 170 310, 260 290 S 350 270, 400 300"></path>
    </g>
    <path d="M150 110 L 300 100 L 320 196 L 170 210 Z" fill="#E4E4DF"></path>
    <g fill="none" stroke="#FFFFFF" stroke-width="3">
      <path d="M160 132 L 310 122"></path><path d="M165 162 L 315 152"></path><path d="M168 190 L 318 181"></path>
      <path d="M200 108 L 210 206"></path><path d="M250 105 L 262 202"></path>
    </g>
    <text x="214" y="146" font-family="'Familjen Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5B636A">TARANCÓN</text>
    <path d="M0 250 C 90 240, 150 200, 230 205 S 340 230, 390 210" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"></path>
    <path d="M0 250 C 90 240, 150 200, 230 205 S 340 230, 390 210" fill="none" stroke="#0B4C94" stroke-width="6" stroke-linecap="round"></path>
    <text x="300" y="250" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#0B4C94">A-3</text>
    <path d="M196 206 C 200 190, 214 182, 226 176" fill="none" stroke="#0B4C94" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"></path>
    <g>
      <path d="M216 150 a 14 14 0 0 1 28 0 v 22 h -28 z" fill="#FFFFFF" stroke="#161B1F" stroke-width="2"></path>
      <path d="M216 150 a 14 14 0 0 1 28 0 z" fill="#C0392B"></path>
      <text x="230" y="167" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#161B1F">118</text>
    </g>
  </svg>

  <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between">
    <button type="button" aria-label="Volver a la lista" style="width: 44px; height: 44px; border: 1px solid #DADAD6; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(22,27,31,0.10)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161B1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <button type="button" aria-label="Compartir esta gasolinera" style="width: 44px; height: 44px; border: 1px solid #DADAD6; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(22,27,31,0.10)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 282px; bottom: 0; background: #FFFFFF; border-top: 1px solid #DADAD6; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 22px rgba(22,27,31,0.10); padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; display: block; width: 38px; height: 5px; border-radius: 3px; background: #CFCFC9; margin: 7px 0 0"></span>

    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 48px; flex-shrink: 0; border: 2px solid #161B1F; border-radius: 11px 11px 3px 3px; overflow: hidden; text-align: center; background: #FFFFFF">
        <div style="height: 13px; background: #C0392B"></div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; line-height: 1; padding: 6px 0 2px">118</div>
        <div style="font-size: 10px; font-weight: 700; color: #5B636A; padding-bottom: 5px">KM</div>
      </div>
      <div style="flex: 1">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05">Ballenoil</h1>
        <div style="font-size: 15px; color: #5B636A; margin-top: 3px">Av. Miguel de Cervantes, 41 · Tarancón (Cuenca)</div>
        <span style="display: inline-block; margin-top: 7px; background: #0B4C94; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; border-radius: 3px; padding: 3px 6px 2px">LA MÁS BARATA DE TU RUTA</span>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 2px solid #161B1F; border-bottom: 1px solid #DADAD6">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 44px; font-weight: 600; line-height: 1; color: #0B4C94; letter-spacing: -0.02em">1,639</span>
      <span style="font-size: 17px; font-weight: 700">€/L</span>
      <span style="margin-left: auto; text-align: right; font-size: 14px; line-height: 1.3; color: #3E464D">Gasolina 95<br><b style="color: #161B1F"><span style="font-family: 'IBM Plex Mono', monospace">0,21</span> € menos</b> por litro</span>
    </div>

    <dl style="margin: 0; display: grid; grid-template-columns: 124px 1fr; font-size: 15px">
      <dt style="padding: 9px 0; color: #5B636A; border-bottom: 1px solid #E6E6E2">Desvío</dt>
      <dd style="margin: 0; padding: 9px 0; font-weight: 600; border-bottom: 1px solid #E6E6E2"><span style="font-family: 'IBM Plex Mono', monospace">0,8</span> km ida y vuelta · <span style="font-family: 'IBM Plex Mono', monospace">2</span> min</dd>
      <dt style="padding: 9px 0; color: #5B636A; border-bottom: 1px solid #E6E6E2">Horario</dt>
      <dd style="margin: 0; padding: 9px 0; font-weight: 600; border-bottom: 1px solid #E6E6E2">Abierta 24 horas</dd>
      <dt style="padding: 9px 0; color: #5B636A; border-bottom: 1px solid #E6E6E2">En tu ruta</dt>
      <dd style="margin: 0; padding: 9px 0; font-weight: 600; border-bottom: 1px solid #E6E6E2">km <span style="font-family: 'IBM Plex Mono', monospace">118</span> de <span style="font-family: 'IBM Plex Mono', monospace">352</span>, salida 81 de la A-3</dd>
      <dt style="padding: 9px 0; color: #5B636A">Precio</dt>
      <dd style="margin: 0; padding: 9px 0; font-weight: 600">MITECO, hace <span style="font-family: 'IBM Plex Mono', monospace">12</span> min</dd>
    </dl>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="#" style="height: 52px; border-radius: 10px; border: 1.5px solid #161B1F; color: #161B1F; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg>
        Cómo llegar
      </a>
      <button type="button" style="height: 52px; border: 0; border-radius: 10px; background: #0B4C94; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Añadir parada
      </button>
    </div>
  </div>
</div>
</x-dc>
