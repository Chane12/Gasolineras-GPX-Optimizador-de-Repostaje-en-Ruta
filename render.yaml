# Blueprint de Render: la API (FastAPI) en el plan gratuito (ADR 0002, docs/web/plan.md).
# Se aplica una vez desde el panel de Render (New → Blueprint → este repo). A partir de ahí, cada
# commit en main que toque la API o el motor la vuelve a desplegar sola.
services:
  - type: web
    name: gasolineras-api
    runtime: docker
    repo: https://github.com/Chane12/Gasolineras-GPX-Optimizador-de-Repostaje-en-Ruta
    branch: main
    plan: free
    region: frankfurt # la más cercana a España en el plan gratuito
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - api/**
        - core/**
        - Dockerfile
        - .dockerignore
        - pyproject.toml
        - uv.lock
        - render.yaml
    envVars:
      # Dominios de la web que pueden llamar a la API desde el navegador (separados por comas):
      # la web en local y la de Vercel (proyecto gasolineras-web, equipo gasol).
      - key: GASOLINERAS_CORS_ORIGINS
        value: http://localhost:3000,https://gasolineras-web.vercel.app,https://gasolineras-web-gasol.vercel.app
      # Vistas previas de Vercel (una por PR o despliegue): gasolineras-<código>-gasol.vercel.app y
      # gasolineras-web-git-<rama>-gasol.vercel.app (Vercel acorta el nombre del proyecto en las de código).
      # La API es pública y sin sesiones, así que el CORS no protege datos: solo evita que otras webs la usen
      # desde el navegador de sus visitantes.
      - key: GASOLINERAS_CORS_ORIGIN_REGEX
        value: https://gasolineras(-web)?-[a-z0-9-]+-gasol\.vercel\.app
      # Detrás de Render, X-Forwarded-For llega como "[lo que mande el cliente], IP real, IP de Cloudflare,
      # IP del balanceador interno" (comprobado el 2026-10-16): la IP real es la tercera empezando por el final.
      - key: GASOLINERAS_TRUSTED_PROXY_HOPS
        value: "3"
      - key: GASOLINERAS_LOG_LEVEL
        value: INFO
