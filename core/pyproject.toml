[project]
name = "gasolineras-core"
version = "1.0.0"
description = "Motor geoespacial de repostaje en ruta (España): ingesta MITECO, GPX, corredor espacial, optimizador."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "folium>=0.15.0",
    "requests>=2.31.0",
    "gpxpy>=1.6.0",
    "pyproj>=3.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",  # fallback parquet del MITECO
]

[project.scripts]
gasolineras = "gasolineras_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gasolineras_core"]
